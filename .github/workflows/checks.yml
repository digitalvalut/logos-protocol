# Runs on every push and every pull request, before anything reaches anybody.
#
# Nothing is installed: no npm, no node_modules, no test framework beyond the
# one built into Node. That is deliberate. This app loads no code written by
# anybody else, and a pipeline that pulled in three hundred packages to check
# it would quietly undo the very thing being checked.
name: controlli

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  controlli:
    runs-on: ubuntu-latest
    # ⚠️ IL timeout va QUI, sul lavoro intero — non sui singoli test.
    # La suite dura ~2 minuti e mezzo; 15 e' abbondante e serve solo perche'
    # una corsa davvero appesa non bruci ore di macchina.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: I controlli statici e la logica
        # Node trova da solo i file in tests/. Nessun flag, e non e' un caso:
        #
        # ⚠️ NON rimettere --test-force-exit. Dal 10 all'11 set 2026 c'era, e
        # faceva SPARIRE nove test in silenzio: la CI diceva 369 quando erano
        # 378, `fail 0`, tutto verde. Serviva perche' `node --test` non
        # terminava mai — timer riarmati dopo la pulizia del banco di prova
        # (`paintAddrCard()` all'avvio e' asincrona). Chiuso alla radice in
        # tests/fake-browser.js: una sandbox fermata non arma piu' niente.
        # Misurato dopo: la suite esce da sola in ~3 minuti. Se un giorno
        # torna ad appendersi, la risposta e' trovare il timer, non il flag.
        #
        # ⚠️ E NON rimettere --test-timeout. Quel timeout vale per l'intero
        # FILE, non per il singolo test: logic.test.js dura ~160 s e
        # corse.test.js piu' di 30, quindi con --test-timeout=30000 venivano
        # amazzati tutti e due. Il risultato era `fail 0` ma `cancelled 2`,
        # cioe' rosso senza un solo test sbagliato — e per due giorni
        # l'operatore ha ricevuto email di fallimento per una suite sana.
        run: node --test

      - name: Il file unico si costruisce ancora
        # also the guard that refuses to build while the two version
        # numbers disagree — the oldest trap in this project
        run: python3 build-single-file.py

      - name: Il file unico non è stato lasciato indietro
        # a stale single-file build is a copy of the app with last week's bugs
        # in it, sitting there looking current
        run: |
          if ! git diff --quiet -- digitalvalut-logos.html 2>/dev/null; then
            echo "::warning::digitalvalut-logos.html non è aggiornato rispetto ai sorgenti"
          fi
