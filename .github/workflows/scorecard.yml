# OpenSSF Scorecard: un voto pubblico sull'igiene del repository (firme,
# permessi dei workflow, dipendenze, canale per le segnalazioni, revisione del
# codice…). Aggiunto il 18 set 2026. ⚠️ Alcune voci resteranno basse PER
# COSTRUZIONE: c'e' una persona sola, quindi niente «revisione a due» ne'
# protezione del ramo che richieda un secondo approvatore. Si dice, non si
# trucca. I risultati vanno nella scheda Security → Code scanning.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: results.sarif
      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
