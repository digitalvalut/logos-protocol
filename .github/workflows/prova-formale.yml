# La prova formale del protocollo: si lancia A MANO (Actions -> prova formale),
# non a ogni push — dura fino a un'ora e non ha niente da dire su un commit
# qualunque. Vedi prova-formale/README.md. Tamarin, Maude e ProVerif vengono
# dai loro rilasci ufficiali (GitHub e INRIA); niente di tutto questo entra
# nell'app.
name: prova formale
on:
  workflow_dispatch: {}
  # quando cambia un modello o il documento del protocollo: il rito cambia,
  # la prova si rifa' nello stesso momento
  push:
    branches: [ main ]
    paths: [ 'prova-formale/**', '.github/workflows/prova-formale.yml' ]
  # e una volta al mese, per accorgersi se gli strumenti non si scaricano piu'
  # (non per "sorvegliare": una dimostrazione su un modello fisso non cambia)
  schedule:
    - cron: '17 4 1 * *'
# The token these jobs get can only READ the repository: none of them
# writes to it, and a stolen token from a compromised action would then
# be able to do nothing. (Artifacts upload through a separate runtime
# token, so `contents: read` is enough for those too.)
permissions:
  contents: read

jobs:
  # Verifpal: terzo motore, indipendente da Tamarin e ProVerif (18 set 2026).
  # Meno potente, ma se concorda sui punti in comune vale come controllo in
  # piu'; se dissente, va capito chi ha ragione — e' il motivo per cui c'e'.
  # «attack found» nel risultato = rosso.
  verifpal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verifpal 1.4.12 (binario linux dal rilascio ufficiale)
        run: |
          curl -sSL -o vp.zip https://github.com/symbolicsoft/verifpal/releases/download/v1.4.12/verifpal_1.4.12_linux_amd64.zip
          unzip -q vp.zip -d vp && chmod +x vp/verifpal && ./vp/verifpal --version
      - name: verifica di ogni modello contro l'esito ATTESO (.atteso)
        run: prova-formale/verifpal/controlla.sh ./vp/verifpal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: verifpal, path: prova-formale/verifpal/*.log }

  proverif:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compila ProVerif 2.05 dal sorgente ufficiale (INRIA)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml ocaml-findlib >/dev/null
          curl -sSL -o pv.tgz https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz
          ls -la pv.tgz; file pv.tgz
          tar xzf pv.tgz && cd proverif2.05 && (./build 2>&1 | tail -20)
          ls -la proverif
          mkdir -p $HOME/bin && cp proverif $HOME/bin/ && echo "$HOME/bin" >> $GITHUB_PATH
      - name: Ogni modello ProVerif
        run: |
          mkdir -p risultati
          for f in prova-formale/proverif/*.pv; do
            echo "=================== $(basename $f) ==================="
            timeout 600 proverif "$f" > "risultati/$(basename $f).txt" 2>&1 || true
            grep -E "^RESULT|^Error" "risultati/$(basename $f).txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: risultati-proverif, path: risultati }
  tamarin:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scarica Tamarin 1.12.0 e Maude 3.5.1 (rilasci ufficiali)
        run: |
          set -e
          mkdir -p $HOME/bin
          curl -sSL -o t.tgz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          tar xzf t.tgz -C $HOME/bin
          curl -sSL -o m.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          unzip -q -o m.zip -d $HOME/maude
          M=$(for f in $(find $HOME/maude -type f); do file "$f" | grep -q ELF && echo "$f"; done | head -1); chmod +x "$M"; ln -s "$M" $HOME/bin/maude
          echo "MAUDE_LIB=$(dirname "$M")" >> $GITHUB_ENV
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Ogni lemma, una alla volta (8 minuti e 6 GB ciascuna; i veloci prima)
        run: |
          mkdir -p risultati
          for f in prova-formale/tamarin/logos-invito.spthy prova-formale/tamarin/logos-invito-v46.spthy prova-formale/tamarin/logos-contatto.spthy prova-formale/tamarin/logos-contatto-v45.spthy prova-formale/tamarin/logos-indirizzo-leggero.spthy prova-formale/tamarin/logos-indirizzo.spthy; do
            n=$(basename $f .spthy)
            echo "=================== $n ==================="
            for l in $(grep -oE '^lemma [A-Za-z0-9_]+' "$f" | awk '{print $2}'); do
              timeout 480 tamarin-prover --prove="$l" "$f" +RTS -M6g -RTS > "risultati/$n.$l.txt" 2>&1 || true
              r=$(grep -E "^  $l " "risultati/$n.$l.txt" | grep -v incomplete | head -1)
              [ -n "$r" ] && echo "$r" || echo "  $l: NESSUNA RISPOSTA (tempo o memoria esauriti)"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: risultati-tamarin, path: risultati }
