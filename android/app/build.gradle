/* Hand-written, replacing what Bubblewrap generated. That was a Trusted Web
   Activity — a shell that opened a website, so what ran on the phone came down
   the wire at launch and nobody building the package could vouch for it. This
   builds the application into the package instead. */

apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    namespace "io.github.digitalvalut.logos"

    defaultConfig {
        applicationId "io.github.digitalvalut.logos"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 10
        versionName "10"
        resValue "string", "appName", "DV Logos"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* WebViewAssetLoader serves the bundled application from
       https://appassets.androidplatform.net rather than a file:// path. That
       distinction is the whole build — a file:// page is not a secure context,
       and a browser switches off Web Crypto and WebRTC there, which between
       them are all of this app. */
    implementation 'androidx.webkit:webkit:1.11.0'

    /* Deliberately the only one. androidx.core was here for a moment, for the
       window insets, and was taken back out: it injects a permission of its own
       into the manifest, and an app that asks for something nobody can explain
       is a worse trade than a version check written by hand. */
}

/* One source of truth. `digitalvalut-logos.html` is the entire application folded
   into a single file by a script that has been in this repository since August;
   it is deliberately not committed, because a generated 800 KB artefact living in
   git history is a second copy waiting to drift from the first. It is built here
   instead, from the same modifica.* files the website itself is served from, so
   the app inside the package and the app on the site cannot disagree about what
   they are. */
tasks.register('bundleWebApp') {
    def script = file("${rootDir}/../build-single-file.py")
    def built = file("${rootDir}/../digitalvalut-logos.html")
    def dest = file("${projectDir}/src/main/assets/logos.html")
    inputs.files(file("${rootDir}/../modifica.js"),
                 file("${rootDir}/../modifica.html"),
                 file("${rootDir}/../modifica.css"))
    outputs.file(dest)
    doLast {
        if (!script.exists()) throw new GradleException("build-single-file.py not found at ${script}")
        def out = new ByteArrayOutputStream()
        def res = providers.exec {
            workingDir "${rootDir}/.."
            commandLine 'python3', 'build-single-file.py'
        }
        def text = res.standardOutput.asText.get()
        logger.lifecycle(text.trim())
        if (!built.exists()) throw new GradleException("build-single-file.py produced no ${built}")
        dest.parentFile.mkdirs()
        dest.text = built.getText('UTF-8')
        logger.lifecycle("bundled web app: ${dest.length()} bytes")
    }
}
tasks.configureEach { t ->
    if (t.name == 'preBuild') t.dependsOn('bundleWebApp')
}
